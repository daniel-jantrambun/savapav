name: Test, build Docker image and deploy it on Synology

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "compose.yaml"
      - "Dockerfile"
      - "web/**"
      - ".github/workflows/test-build-deploy.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/savapav
  NAS_PLATFORM: linux/amd64
  NAS_DIR: /volume1/docker/savapav
  # Transit des fichiers envoyés au NAS (le préfixe @ le masque dans File Station).
  STAGE: /volume1/@savapav-incoming

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test API
        run: |
          pip install -e '.[dev]'
          ruff check src tests
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint and build web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    # Les PR sont testées, mais seul main (ou un tag) part sur le NAS, une fois les variables du NAS configurées.
    if: github.event_name != 'pull_request' && vars.SYNOLOGY_PRIVATE_IP != ''
    runs-on: ubuntu-latest
    # Le temps passé en attente (concurrency) ne compte pas : seulement l'exécution du job.
    timeout-minutes: 40
    concurrency: deploy-nas
    steps:
      - uses: actions/checkout@v4

      # Une variable vide donne sinon une erreur ssh peu lisible (« usage: ssh ... » pour un TARGET en « @ip »).
      - name: Check NAS settings
        env:
          SYNOLOGY_USER_LOGIN: ${{ vars.SYNOLOGY_USER_LOGIN }}
          SYNOLOGY_PRIVATE_IP: ${{ vars.SYNOLOGY_PRIVATE_IP }}
          SYNOLOGY_USER_PWD: ${{ secrets.SYNOLOGY_USER_PWD }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
          COACH_SECRET_KEY: ${{ secrets.COACH_SECRET_KEY }}
        run: |
          missing=0
          for name in SYNOLOGY_USER_LOGIN SYNOLOGY_PRIVATE_IP SYNOLOGY_USER_PWD WG_CONFIG COACH_SECRET_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name non configuré (Settings → Secrets and variables → Actions)"; missing=1; }
          done
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Le front est construit dans le Dockerfile (étape node). Une seule architecture : celle du NAS.
      - uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: .
          platforms: ${{ env.NAS_PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le Synology n'accède pas à ghcr.io (son VPN client bloque le TLS) : on exporte ici l'image,
      # avant WireGuard qui coupe l'accès DNS/Internet du runner.
      - name: Export image for the NAS
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          docker pull --platform "$NAS_PLATFORM" "$IMAGE:$TAG"
          docker save --platform "$NAS_PLATFORM" "$IMAGE:$TAG" | gzip > coach-image.tar.gz
          ls -lh coach-image.tar.gz

      - name: Connect WireGuard
        timeout-minutes: 3
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf sshpass
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      # Crée le .env du NAS à partir de .env.example s'il n'existe pas, puis y écrit le secret COACH_SECRET_KEY
      # (à chaque déploiement : le secret GitHub fait foi) et SAVAPAV_PORT si la variable GitHub est définie.
      # Les autres variables du .env ne sont pas touchées.
      # stdin = mot de passe sudo, secret, port, puis .env.example : sudo -S lit le mot de passe octet par octet
      # jusqu'au saut de ligne, la suite parvient au script. Le secret n'apparaît dans aucune ligne de commande.
      - name: Write env file on NAS
        timeout-minutes: 3
        env:
          SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
          TARGET: ${{ vars.SYNOLOGY_USER_LOGIN }}@${{ vars.SYNOLOGY_PRIVATE_IP }}
          COACH_SECRET_KEY: ${{ secrets.COACH_SECRET_KEY }}
          SAVAPAV_PORT: ${{ vars.SAVAPAV_PORT }}
        run: |
          nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }
          [ -n "$COACH_SECRET_KEY" ] || { echo "Secret COACH_SECRET_KEY non configuré dans le dépôt" >&2; exit 1; }
          case "$SAVAPAV_PORT" in
            "" | [1-9] | [1-9][0-9] | [1-9][0-9][0-9] | [1-9][0-9][0-9][0-9] | [1-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "Variable SAVAPAV_PORT invalide : $SAVAPAV_PORT" >&2; exit 1 ;;
          esac
          { printf '%s\n%s\n%s\n' "$SSHPASS" "$COACH_SECRET_KEY" "$SAVAPAV_PORT"; cat .env.example; } | nas "sudo -S -p '' sh -euc '
            umask 077
            IFS= read -r key
            IFS= read -r port
            mkdir -p $NAS_DIR/data
            if [ ! -f $NAS_DIR/.env ]; then
              cat > $NAS_DIR/.env
              echo \"$NAS_DIR/.env créé à partir de .env.example\"
            fi
            set_var() {
              { grep -v \"^\$1=\" $NAS_DIR/.env || true; printf \"%s=%s\n\" \"\$1\" \"\$2\"; } > $NAS_DIR/.env.tmp
              cat $NAS_DIR/.env.tmp > $NAS_DIR/.env
              rm $NAS_DIR/.env.tmp
            }
            set_var COACH_SECRET_KEY \"\$key\"
            if [ -n \"\$port\" ]; then set_var SAVAPAV_PORT \"\$port\"; fi
            chmod 600 $NAS_DIR/.env'"

      # Transfère l'image et le compose.yaml du dépôt, puis docker load + compose up -d.
      # data/ reste sur le NAS et ne transite jamais par la CI.
      # Le mot de passe est envoyé sur stdin pour sudo -S : il n'apparaît pas dans la ligne de commande distante.
      - name: Deploy on Synology
        timeout-minutes: 15
        env:
          SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
          TARGET: ${{ vars.SYNOLOGY_USER_LOGIN }}@${{ vars.SYNOLOGY_PRIVATE_IP }}
          NAS_USER: ${{ vars.SYNOLOGY_USER_LOGIN }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }

          # Garde-fou : l'image exportée doit correspondre à l'architecture du NAS.
          [ "$(nas uname -m)" = x86_64 ] || { echo "Le NAS n'est plus en x86_64 : adapter NAS_PLATFORM" >&2; exit 1; }

          # /tmp est sur la partition système de DSM (~2 Go) : on transite par un dossier du volume, hors des
          # dossiers partagés (leurs ACL Synology empêchent ci-github d'y écrire, même après chown).
          echo "$SSHPASS" | nas "sudo -S -p '' sh -euc 'mkdir -p $STAGE && chown $NAS_USER $STAGE && chmod 700 $STAGE'"
          nas "test -w $STAGE" || { echo "$NAS_USER ne peut pas écrire dans $STAGE" >&2; exit 1; }
          REMOTE_TAR=$STAGE/coach-image.tar.gz
          REMOTE_COMPOSE=$STAGE/compose.yaml

          nas "cat > $REMOTE_TAR" < coach-image.tar.gz
          nas "cat > $REMOTE_COMPOSE" < compose.yaml

          echo "$SSHPASS" | nas "sudo -S -p '' sh -euc '
            [ -f $NAS_DIR/.env ] || { echo \"$NAS_DIR/.env manquant (voir README, installation du NAS)\" >&2; exit 1; }
            /usr/local/bin/docker load -i $REMOTE_TAR
            rm -f $REMOTE_TAR
            # Seule l image de l app est épinglée sur ce commit ; celle d Ollama reste inchangée.
            sed \"s#^\\( *image: ghcr.io/[^/]*/savapav\\):.*#\\1:$TAG#\" $REMOTE_COMPOSE > $NAS_DIR/compose.yaml
            rm -f $REMOTE_COMPOSE
            grep image: $NAS_DIR/compose.yaml
            cd $NAS_DIR
            # Docker sur DSM ne crée pas les dossiers des bind mounts.
            mkdir -p data ollama
            /usr/local/bin/docker compose up -d --remove-orphans'"

      # Déclare le projet dans Container Manager s'il n'y est pas, sur $NAS_DIR et son compose.yaml : les
      # conteneurs lancés par la CI (projet compose du même nom) y apparaissent alors comme un projet géré.
      # La méthode create de SYNO.Docker.Project n'est pas documentée (paramètres repris de l'interface DSM) :
      # en cas d'échec, le déploiement n'est pas bloqué, il suffit de créer le projet à la main.
      # Le script distant est envoyé sur stdin après le mot de passe sudo, pour éviter un niveau de guillemets.
      - name: Ensure Container Manager project
        continue-on-error: true
        timeout-minutes: 3
        env:
          SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
          TARGET: ${{ vars.SYNOLOGY_USER_LOGIN }}@${{ vars.SYNOLOGY_PRIVATE_IP }}
        run: |
          nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }
          PROJECT=$(basename "$NAS_DIR")
          # Chemin relatif aux dossiers partagés, comme l'attend Container Manager : /docker/savapav
          SHARE_PATH=${NAS_DIR#/volume[0-9]}
          # compose.yaml épinglé du NAS, encodé en chaîne JSON puis échappé pour des guillemets simples sh.
          CONTENT=$(echo "$SSHPASS" | nas "sudo -S -p '' cat $NAS_DIR/compose.yaml" | jq -Rs .)
          CONTENT=${CONTENT//\'/\'\\\'\'}
          { echo "$SSHPASS"; cat <<EOF
          set -eu
          api() { /usr/syno/bin/synowebapi --exec api=SYNO.Docker.Project version=1 "\$@"; }
          exists() { api method=list | grep -q '"name" *: *"$PROJECT"'; }
          if exists; then echo "Projet $PROJECT déjà présent dans Container Manager"; exit 0; fi
          api method=create name='"$PROJECT"' share_path='"$SHARE_PATH"' enable_service_portal=false content='$CONTENT'
          exists || { echo "Projet $PROJECT non créé dans Container Manager : le créer à la main" >&2; exit 1; }
          echo "Projet $PROJECT créé dans Container Manager"
          EOF
          } | nas "sudo -S -p '' sh -s"

      - name: Check the app answers
        timeout-minutes: 3
        env:
          SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
          TARGET: ${{ vars.SYNOLOGY_USER_LOGIN }}@${{ vars.SYNOLOGY_PRIVATE_IP }}
        run: |
          nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }
          # Port publié sur le NAS (SAVAPAV_PORT du .env, illisible sans root) : « 0.0.0.0:8000 » -> 8000.
          PORT=$(echo "$SSHPASS" | nas "sudo -S -p '' /usr/local/bin/docker port savapav-web 8000" | head -n 1)
          PORT=${PORT##*:}
          echo "App publiée sur le port $PORT du NAS"
          for _ in $(seq 1 10); do
            nas "curl -fsS http://localhost:$PORT/api/health" && exit 0
            sleep 3
          done
          echo "L'app ne répond pas sur le NAS après le déploiement" >&2
          exit 1

      - name: Disconnect
        if: always()
        timeout-minutes: 2
        run: sudo wg-quick down wg0
