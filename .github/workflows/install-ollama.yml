name: Install Ollama on Synology

# À lancer à la main : au premier déploiement, puis pour changer de version d'Ollama ou de modèle.
# La CI pilote le NAS en SSH via WireGuard ; le NAS tire lui-même l'image (Docker Hub) et le modèle (ollama pull).
on:
    workflow_dispatch:
        inputs:
            model:
                description:
                    Modèle Ollama à installer (doit correspondre à
                    COACH_LLM_MODEL dans le .env du NAS)
                default: qwen2.5:3b
                required: true

permissions:
    contents: read

env:
    NAS_PLATFORM: linux/amd64
    NAS_DIR: /volume1/docker/savapav

jobs:
    install:
        runs-on: ubuntu-latest
        # Image (~4 Go) et modèle (~2 Go) téléchargés par le NAS : c'est long, mais pas illimité.
        timeout-minutes: 45
        concurrency: deploy-nas
        steps:
            - uses: actions/checkout@v4

            - name: Connect WireGuard
              timeout-minutes: 3
              run: |
                  sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf sshpass
                  echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
                  sudo chmod 600 /etc/wireguard/wg0.conf
                  sudo wg-quick up wg0

            # Le modèle est téléchargé par un conteneur Ollama temporaire, monté sur le même dossier que le service
            # llm : ça marche avant le premier déploiement (pas encore de compose.yaml ni de .env sur le NAS), et
            # avec la version d'Ollama du compose.yaml du dépôt. Les modèles déjà présents sont conservés.
            - name: Install on Synology
              timeout-minutes: 40
              env:
                  SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
                  TARGET:
                      ${{ vars.SYNOLOGY_USER_LOGIN }}@${{
                      vars.SYNOLOGY_PRIVATE_IP }}
                  MODEL: ${{ inputs.model }}
              run: |
                  nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }
                  [ "$(nas uname -m)" = x86_64 ] || { echo "Le NAS n'est plus en x86_64 : adapter NAS_PLATFORM" >&2; exit 1; }
                  # Le nom du modèle part dans une commande distante : on n'accepte que des caractères sûrs.
                  [[ "$MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "Nom de modèle invalide : $MODEL" >&2; exit 1; }

                  # La version d'Ollama vient du compose.yaml : une seule source de vérité.
                  OLLAMA_IMAGE=$(grep -o 'ollama/ollama:[^ "]*' compose.yaml)
                  echo "Installation de $OLLAMA_IMAGE et du modèle $MODEL sur le NAS..."

                  echo "$SSHPASS" | nas "sudo -S -p '' sh -euc '
                    docker=/usr/local/bin/docker
                    \$docker pull --platform $NAS_PLATFORM $OLLAMA_IMAGE
                    mkdir -p $NAS_DIR/ollama
                    \$docker rm -f savapav-ollama-install >/dev/null 2>&1 || true
                    \$docker run -d --name savapav-ollama-install -v $NAS_DIR/ollama:/root/.ollama $OLLAMA_IMAGE
                    trap \"\$docker rm -f savapav-ollama-install >/dev/null\" EXIT
                    # Le serveur Ollama met quelques secondes à démarrer.
                    for _ in \$(seq 1 30); do
                      \$docker exec savapav-ollama-install ollama list >/dev/null 2>&1 && break
                      sleep 1
                    done
                    \$docker exec savapav-ollama-install ollama pull $MODEL
                    \$docker exec savapav-ollama-install ollama list
                    # Service llm déjà déployé : on le relance pour qu il prenne la nouvelle image.
                    if [ -f $NAS_DIR/compose.yaml ] && [ -f $NAS_DIR/.env ]; then
                      cd $NAS_DIR && \$docker compose up -d llm
                    fi
                    # Les anciennes versions de l image Ollama.
                    \$docker image prune -f'"

            - name: Disconnect
              if: always()
              timeout-minutes: 2
              run: sudo wg-quick down wg0
